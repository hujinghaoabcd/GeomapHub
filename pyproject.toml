[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "geomaphub"
version = "0.1.0.dev0"
description = "A lightweight geospatial data portal and web mapping platform"
requires-python = ">=3.12,<3.14"
dependencies = [
  "Django>=5.2,<6.0",
  "django-cors-headers>=4.7,<5.0",
  "django-environ>=0.12,<1.0",
  "django-ninja>=1.4,<2.0",
  "celery[redis]>=5.5,<6.0",
  "psycopg[binary]>=3.2,<4.0",
  "gunicorn>=23,<24",
  "uvicorn>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-django>=4.11,<5",
  "ruff>=0.12,<1",
]
storage = [
  "boto3>=1.39,<2",
  "django-storages[s3]>=1.14,<2",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["backend"]
testpaths = ["backend"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.setuptools]
packages = []

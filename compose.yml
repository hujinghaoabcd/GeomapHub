name: geomaphub

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geomaphub}
      POSTGRES_USER: ${POSTGRES_USER:-geomaphub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geomaphub}
    volumes:
      - postgis-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geomaphub} -d ${POSTGRES_DB:-geomaphub}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-geomaphub}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-geomaphub-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: >-
      sh -c "python manage.py makemigrations accounts organizations resources jobs --noinput &&
      python manage.py migrate &&
      gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000"
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A config worker --loglevel=INFO --queues=default,imports,rasters,vectors,processing,system
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  martin:
    image: ghcr.io/maplibre/martin:latest
    environment:
      DATABASE_URL: ${MARTIN_DATABASE_URL:-postgresql://geomaphub:geomaphub@db:5432/geomaphub}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgis-data:
  redis-data:
  minio-data:
